<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보안 점검">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>휴대폰 보안 차단 점검</title>
<style>
:root{
  --bg:#f3f4f1;--card:#fff;--ink:#1b211d;--muted:#5b645e;--line:#dde1db;--soft:#eceee9;
  --accent:#2f4b3b;--accent-ink:#fff;
  --ok:#1d6f40;--ok-bg:#e1f1e6;
  --bad:#b3261e;--bad-bg:#fbe3e0;
  --warn:#7a5200;--warn-bg:#faefd2;
  --unk:#4a5560;--unk-bg:#e6eaee;
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101311;--card:#191d1a;--ink:#e5e9e6;--muted:#99a29c;--line:#2a312c;--soft:#212723;
    --accent:#a5c7b0;--accent-ink:#0e1912;
    --ok:#6dd396;--ok-bg:#14301e;
    --bad:#ff8e83;--bad-bg:#3d1916;
    --warn:#efc369;--warn-bg:#33290f;
    --unk:#b4bfc8;--unk-bg:#222930;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all}
main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.banner{margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14px;background:var(--warn-bg);color:var(--warn)}

[data-tone="ok"]{--tone:var(--ok);--tone-bg:var(--ok-bg)}
[data-tone="bad"]{--tone:var(--bad);--tone-bg:var(--bad-bg)}
[data-tone="warn"]{--tone:var(--warn);--tone-bg:var(--warn-bg)}
[data-tone="unk"]{--tone:var(--unk);--tone-bg:var(--unk-bg)}

.result{overflow:hidden;border-radius:var(--r);background:var(--tone-bg);border:3px solid var(--tone)}
.stripe{height:12px;color:var(--tone);background:repeating-linear-gradient(90deg,currentColor 0 14px,transparent 14px 28px);background-size:28px 100%;animation:slide .8s linear infinite}
@keyframes slide{from{background-position:0 0}to{background-position:28px 0}}
.rbody{padding:28px 22px 20px;text-align:center}
.icon{width:84px;height:84px;margin:0 auto 14px;color:var(--tone)}
.icon svg{width:100%;height:100%;display:block}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:36px;line-height:1.2;font-weight:900;letter-spacing:-.02em;color:var(--tone)}
.msg{margin:12px 0 0;font-size:17px;font-weight:600}
.items{display:grid;gap:8px;margin:18px 0 0;text-align:left}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.item .k{font-size:16px;font-weight:700}
.item .v{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:800;color:var(--tone);text-align:right}
.item .v svg{width:20px;height:20px;flex:none}
.item .v small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.why{margin:12px 0 0;font-size:13px;color:var(--muted)}
.meta{margin:4px 0 0;font-size:13px;color:var(--muted)}
.clockbox{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:20px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--tone) 30%,transparent)}
.clock{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800}
.elapsed{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;white-space:pre-line}
.hint{margin:10px 0 0;font-size:12px;color:var(--muted)}
.result.stale .rbody>*:not(.clockbox){opacity:.35}
.result.stale .elapsed{color:var(--bad);font-weight:800}

.appbox{margin-top:14px}
.appbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:8px;padding:16px;border-radius:14px;background:var(--bad);color:#fff;font-size:18px;font-weight:800;text-decoration:none;text-align:center}
.appbtn small{font-size:13px;font-weight:600;opacity:.85}
.appbtn svg{width:22px;height:22px;flex:none}
.appbtn.secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-size:16px;padding:14px}
.appnote{margin:8px 2px 0;font-size:12px;color:var(--muted);text-align:center}
.again{display:block;width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.again:disabled{opacity:.5;cursor:default}

details.more{margin-top:14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details.more summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:12px 0 0;font-size:13px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;word-break:break-all}
.btn{margin-top:12px;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.foot{margin:14px 4px 0;font-size:12px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;z-index:10;white-space:nowrap}
#probe{position:fixed;right:0;bottom:0;width:32px;height:24px;opacity:.01;pointer-events:none}
@media (prefers-reduced-motion:reduce){.stripe{animation-duration:2.4s}}
</style>
</head>
<body>
<main>
  <div id="banners"></div>

  <section class="result" id="result" data-tone="unk" aria-live="polite">
    <div class="stripe"></div>
    <div class="rbody">
      <div class="icon" id="icon"></div>
      <h1 id="title">점검 준비 중</h1>
      <p class="msg" id="msg"></p>
      <div class="items" id="items" hidden></div>
      <p class="why" id="why"></p>
      <p class="meta" id="meta"></p>
      <div class="clockbox" id="clockbox" hidden>
        <div class="clock" id="clock">--:--:--.-</div>
        <div class="elapsed" id="elapsed"></div>
      </div>
      <p class="hint" id="hint" hidden>시계와 줄무늬가 움직이면 실제 화면, 멈춰 있으면 캡처 화면입니다.</p>
    </div>
  </section>

  <div class="appbox" id="appbox" hidden>
    <div id="appbtns"></div>
    <p class="appnote" id="appnote"></p>
  </div>

  <button type="button" class="again" id="again" disabled>다시 점검</button>

  <details class="more">
    <summary>자세히 (문제 확인용)</summary>
    <dl class="kv" id="raw"></dl>
    <button type="button" class="btn" id="copy">결과 복사</button>
  </details>

  <p class="foot">카메라·마이크·위치를 잠깐 확인만 하고, 아무것도 저장하거나 보내지 않습니다.</p>
</main>
<video id="probe" playsinline muted autoplay></video>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  'use strict';

  const $ = s => document.querySelector(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad = n => String(n).padStart(2, '0');
  const round = (x, d) => { const p = Math.pow(10, d); return Math.round(x * p) / p; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const UA = navigator.userAgent;
  const IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const INAPP = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|BAND\/|DaumApps|everytimeApp/i.test(UA);

  const ICONS = {
    check:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="21"/><path d="M14 24.5l7 7 13-14"/></svg>',
    alert:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4L45 42H3z"/><path d="M24 18v11"/><circle cx="24" cy="35.5" r="1.2" fill="currentColor"/></svg>',
    info:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="24" cy="24" r="21"/><path d="M24 22v13"/><circle cx="24" cy="14.5" r="1.2" fill="currentColor"/></svg>',
    spin:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><g class="spin"><path d="M24 3a21 21 0 1 1-21 21" /></g></svg>'
  };

  const PERM_HELP = IOS
    ? '주소창의 ‘가가’ → 웹사이트 설정에서 카메라·마이크·위치를 ‘허용’으로 바꾼 뒤 다시 점검하세요.'
    : '주소창 왼쪽 아이콘 → 권한에서 카메라·마이크·위치를 ‘허용’으로 바꾼 뒤 다시 점검하세요.';
  const GPS_HELP = IOS
    ? '설정 → 개인정보 보호 및 보안 → 위치 서비스를 끈 뒤 이 화면으로 돌아오세요.'
    : '화면 위에서 아래로 쓸어내려 ‘위치’를 끈 뒤 이 화면으로 돌아오세요.';

  const VERDICTS = {
    pass:    {tone:'ok',   icon:'check', title:'차단 완료',    msg:'잘하셨습니다! 보안 차단이 적용되어 있습니다.'},
    fail:    {tone:'bad',  icon:'alert', title:'차단 안 됨',   msg:'카메라가 켜집니다. 아래 버튼으로 보안앱을 열어 차단한 뒤 다시 점검하세요.'},
    gps:     {tone:'bad',  icon:'alert', title:'GPS를 꺼 주세요', msg:'카메라는 차단됐지만 위치(GPS)가 켜져 있습니다. ' + GPS_HELP},
    denied:  {tone:'warn', icon:'info',  title:'권한 허용 필요', msg:'권한이 ‘거부’로 되어 있어 점검할 수 없습니다. ' + PERM_HELP},
    unknown: {tone:'unk',  icon:'info',  title:'점검할 수 없음', msg:'다시 점검해 주세요. 계속되면 Chrome이나 삼성 인터넷으로 여세요.'}
  };
  // 항목별 표시
  const GPS_ITEM = {off:{w:'꺼짐', t:'ok', i:'ok'}, on:{w:'켜짐', t:'bad', i:'x'}, denied:{w:'권한 거부', t:'warn', i:'q'}, unknown:{w:'확인 불가', t:'unk', i:'q'}};
  const ITEM = {blocked:{w:'차단됨', t:'ok', i:'ok'}, open:{w:'차단 안 됨', t:'bad', i:'x'}, denied:{w:'권한 거부', t:'warn', i:'q'}, unknown:{w:'확인 불가', t:'unk', i:'q'}};
  const MINI = {
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    q:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>'
  };

  /* ---------- 보안앱 열기 ----------
     안드로이드: 앱 패키지로 실행 시도 → 실패하면 Play 스토어(설치돼 있으면 ‘열기’ 버튼)
     아이폰: 공개된 앱 전용 주소가 없어 App Store(설치돼 있으면 ‘열기’ 버튼)로 연결
     주소 뒤 ?app=soldier | staff | visitor 로 대상 앱을 하나로 지정 가능 */
  const ANDROID_APPS = {
    soldier:{label:'병사용', pkg:'kr.go.mnd.mmsa'},
    staff:{label:'간부·직원용', pkg:'kr.mil.mnd.mmsa.of'}
  };
  const IOS_APPS = {
    soldier:{label:'', id:'1485356492'},
    staff:{label:'', id:'1485356492'},
    visitor:{label:'외부인용', id:'1489115591'}
  };
  const APP_PARAM = new URLSearchParams(location.search).get('app');
  function androidHref(pkg){
    const store = 'https://play.google.com/store/apps/details?id=' + pkg;
    return 'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=' + pkg +
           ';S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  }
  function appTargets(){
    if(IOS){
      const a = IOS_APPS[APP_PARAM] || IOS_APPS.soldier;
      return [{label:a.label, href:'https://apps.apple.com/kr/app/id' + a.id}];
    }
    if(APP_PARAM === 'visitor') return [{label:'외부인용', href:'https://play.google.com/store/search?q=' + encodeURIComponent('국방모바일보안') + '&c=apps'}];
    if(ANDROID_APPS[APP_PARAM]) return [{label:'', href:androidHref(ANDROID_APPS[APP_PARAM].pkg)}];
    return Object.values(ANDROID_APPS).map(a => ({label:a.label, href:androidHref(a.pkg)}));
  }
  const APP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M12 7.5l3 1.2v3c0 2.2-1.3 3.7-3 4.3-1.7-.6-3-2.1-3-4.3v-3z"/></svg>';
  let awaitFix = false;
  function renderApp(verdict, mic){
    const show = verdict === 'fail' || verdict === 'pass';
    $('#appbox').hidden = !show;
    if(!show) return;
    const cls = verdict === 'fail' ? 'appbtn' : 'appbtn secondary';
    $('#appbtns').innerHTML = appTargets().map(t =>
      '<a class="' + cls + '" href="' + esc(t.href) + '">' + APP_ICON + '<span>보안앱 열기' + (t.label ? ' <small>(' + esc(t.label) + ')</small>' : '') + '</span></a>'
    ).join('');
    const storeTip = IOS ? 'App Store가 열리면 ‘열기’를 누르세요.' : '앱이 바로 안 열리면 Play 스토어에서 ‘열기’를 누르세요.';
    let note = '';
    if(verdict === 'fail') note = storeTip + ' 차단 후 이 화면으로 돌아오면 자동으로 다시 점검합니다.';
    else if(mic && mic.s === 'open' && !IOS) note = '녹음까지 막으려면 보안앱에서 2차 차단을 실행하세요. ' + storeTip;
    $('#appnote').textContent = note;
    $('#appnote').hidden = !note;
  }

  let running = false;
  let clockTimer = null;
  let toastTimer = null;
  let last = null;

  /* ---------- 기기 정보 ---------- */
  function browserName(){
    const list = [
      [/SamsungBrowser\/([\d.]+)/, '삼성 인터넷'], [/Whale\/([\d.]+)/, '웨일'], [/EdgA?\/([\d.]+)/, 'Edge'],
      [/CriOS\/([\d.]+)/, 'Chrome(iOS)'], [/FxiOS\/([\d.]+)/, 'Firefox(iOS)'], [/Firefox\/([\d.]+)/, 'Firefox'],
      [/Chrome\/([\d.]+)/, 'Chrome'], [/Version\/([\d.]+).*Safari/, 'Safari']
    ];
    for(const [re, name] of list){ const m = UA.match(re); if(m) return name + ' ' + m[1].split('.')[0]; }
    return '알 수 없음';
  }
  function deviceLine(){
    let os = '', m;
    if((m = UA.match(/Android ([\d.]+)/))) os = 'Android ' + m[1];
    else if((m = UA.match(/(?:iPhone|CPU) OS ([\d_]+)/))) os = 'iOS ' + m[1].replace(/_/g, '.');
    const model = UA.match(/;\s*(SM-[A-Z0-9]+|Pixel [^;)]+)/);
    return [os, model ? model[1] : ''].filter(Boolean).join(' · ') || '알 수 없음';
  }

  /* ---------- 네트워크 ---------- */
  // 안드로이드 Chrome·삼성 인터넷만 지원. 와이파이에 '연결'돼 있으면 2차 차단이 안 된 것으로 확정할 수 있음
  function netType(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c && c.type ? c.type : null;
  }
  const NET_WORD = {wifi:'와이파이 연결', cellular:'모바일 데이터', none:'연결 없음', ethernet:'유선', bluetooth:'블루투스', unknown:'알 수 없음'};
  const netWord = t => t ? (NET_WORD[t] || t) : '확인 불가';

  /* ---------- 측정 도구 ---------- */
  async function permState(name){
    try{
      if(!navigator.permissions || !navigator.permissions.query) return '미지원';
      return (await navigator.permissions.query({name})).state;
    }catch(e){ return '미지원'; }
  }
  async function deviceCount(kind){
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return null;
      return (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === kind).length;
    }catch(e){ return null; }
  }
  function gum(constraints, ms){
    return new Promise((resolve, reject) => {
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        const e = new Error('카메라·마이크 기능 없음'); e.name = 'NoMediaDevices'; reject(e); return;
      }
      let done = false;
      const timer = setTimeout(() => {
        if(done) return; done = true;
        const e = new Error('응답 없음'); e.name = 'TimeoutError'; reject(e);
      }, ms);
      navigator.mediaDevices.getUserMedia(constraints).then(s => {
        if(done){ s.getTracks().forEach(t => t.stop()); return; }
        done = true; clearTimeout(timer); resolve(s);
      }, err => { if(done) return; done = true; clearTimeout(timer); reject(err); });
    });
  }
  async function openStream(kind){
    // 태그를 찍을 때 뒷면 카메라는 가려지므로 전면 카메라로 확인
    const primary = kind === 'video'
      ? {video:{facingMode:'user'}, audio:false}
      : {audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, video:false};
    try{ return await gum(primary, 20000); }
    catch(err){
      if(err && (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError' || err.name === 'TypeError'))
        return await gum(kind === 'video' ? {video:true, audio:false} : {audio:true, video:false}, 20000);
      throw err;
    }
  }
  async function framesFlow(stream){
    const v = $('#probe');
    const tr = stream.getVideoTracks()[0];
    try{
      v.srcObject = stream;
      try{ await v.play(); }catch(e){}
      const start = performance.now();
      while(performance.now() - start < 3000){
        if(tr && tr.readyState === 'ended') return {flow:false, note:'영상이 바로 끊김'};
        if(v.videoWidth > 0 && v.readyState >= 2) return {flow:true, note:v.videoWidth + 'x' + v.videoHeight};
        await sleep(100);
      }
      return {flow:false, note:'영상 프레임 없음'};
    }finally{
      try{ v.pause(); }catch(e){}
      v.srcObject = null;
    }
  }
  async function measureByRecorder(stream){
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if(!window.MediaRecorder || !OAC) return {ok:false, note:'소리 분석 미지원'};
    let rec;
    try{ rec = new MediaRecorder(stream); }catch(e){ return {ok:false, note:'녹음기 생성 실패'}; }
    const chunks = [];
    rec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    try{ rec.start(); }catch(e){ return {ok:false, note:'녹음 시작 실패'}; }
    await sleep(1600);
    try{ rec.stop(); }catch(e){}
    await Promise.race([stopped, sleep(1500)]);
    const bytes = chunks.reduce((a, c) => a + c.size, 0);
    const tr = stream.getAudioTracks()[0];
    // 마이크가 신호를 아예 안 보내면(데이터 없음·트랙 음소거) 녹음이 불가능한 상태 = 무음으로 처리
    const noSignal = {ok:true, method:'recorder', peak:0, zero:0.0001, note:'소리 신호 없음', bytes};
    if(!chunks.length) return noSignal;
    try{
      const ab = await new Blob(chunks, {type:rec.mimeType || chunks[0].type}).arrayBuffer();
      const oac = new OAC(1, 44100, 44100);
      const audio = await new Promise((res, rej) => { const p = oac.decodeAudioData(ab, res, rej); if(p && p.then) p.then(res, rej); });
      const d = audio.getChannelData(0);
      let peak = 0;
      for(let i = Math.floor(audio.sampleRate * 0.2); i < d.length; i++){ const a = Math.abs(d[i]); if(a > peak) peak = a; }
      return {ok:true, method:'recorder', peak:round(peak, 6), zero:0.0001, bytes};
    }catch(e){
      if(bytes < 2000 || (tr && tr.muted)) return noSignal;
      return {ok:false, note:'녹음 해석 실패', bytes};
    }
  }
  async function measureLevel(stream, ac){
    let own = false;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!ac && AC){ try{ ac = new AC(); own = true; }catch(e){ ac = null; } }
    if(ac && ac.state === 'suspended'){ try{ await Promise.race([ac.resume(), sleep(400)]); }catch(e){} }
    if(!ac || ac.state !== 'running'){
      if(own && ac){ try{ ac.close(); }catch(e){} }
      return await measureByRecorder(stream);
    }
    let src;
    try{ src = ac.createMediaStreamSource(stream); }catch(e){ return {ok:false, note:'소리 연결 실패'}; }
    const an = ac.createAnalyser(); an.fftSize = 2048; src.connect(an);
    const buf = new Float32Array(an.fftSize), bb = new Uint8Array(an.fftSize);
    let peak = 0;
    await sleep(200);
    const end = performance.now() + 1400;
    while(performance.now() < end){
      if(an.getFloatTimeDomainData) an.getFloatTimeDomainData(buf);
      else { an.getByteTimeDomainData(bb); for(let i = 0; i < bb.length; i++) buf[i] = (bb[i] - 128) / 128; }
      for(let i = 0; i < buf.length; i++){ const a = Math.abs(buf[i]); if(a > peak) peak = a; }
      await sleep(60);
    }
    try{ src.disconnect(); }catch(e){}
    if(own){ try{ await ac.close(); }catch(e){} }
    return {ok:true, method:'analyser', peak:round(peak, 6), zero:0.00001};
  }

  /* ---------- 판정 ---------- */
  // 결과: blocked(막힘) / open(열림) / denied(사용자가 권한 거부) / unknown(판단 불가)
  function classifyError(name, msg, perm, devices){
    const m = (msg || '').toLowerCase();
    if(name === 'NoMediaDevices') return {s:'unknown', why:'이 브라우저에선 점검 불가'};
    if(name === 'TimeoutError') return {s:'unknown', why:'응답 없음'};
    if(name === 'SecurityError') return {s:'unknown', why:'보안 설정으로 실행 불가'};
    if(name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      if(/dismiss/.test(m)) return {s:'unknown', why:'권한 창을 닫음'};
      if(perm === 'denied') return {s:'denied', why:'권한 거부 상태'};
      if(IOS && devices !== 0) return {s:'denied', why:'권한 거부(아이폰)'};
      return {s:'blocked', why:'시스템이 막음'};
    }
    if(['NotReadableError','TrackStartError','AbortError','NotFoundError','DevicesNotFoundError','OverconstrainedError'].includes(name))
      return {s:'blocked', why:'장치를 열 수 없음'};
    return {s:'unknown', why:'알 수 없는 오류'};
  }
  async function checkDevice(kind, ac){
    const r = {};
    const t0 = performance.now();
    let stream = null;
    try{
      stream = await openStream(kind);
      if(kind === 'video'){
        const f = await framesFlow(stream);
        r.detail = f.note;
        r.s = f.flow ? 'open' : 'blocked';
        r.why = f.flow ? '켜짐' : '영상이 안 나옴';
      }else{
        const L = await measureLevel(stream, ac);
        r.level = L;
        if(!L.ok){ r.s = 'unknown'; r.why = L.note; }
        else if(L.peak < L.zero){ r.s = 'blocked'; r.why = L.note || '무음(0)'; }
        else { r.s = 'open'; r.why = '소리 들어옴'; }
      }
    }catch(err){
      r.err = ((err && err.name) || 'Error') + (err && err.message ? ': ' + err.message : '');
      const perm = await permState(kind === 'video' ? 'camera' : 'microphone');
      const devices = await deviceCount(kind === 'video' ? 'videoinput' : 'audioinput');
      r.perm = perm; r.devices = devices;
      const c = classifyError(err && err.name, err && err.message, perm, devices);
      r.s = c.s; r.why = c.why + ' (' + ((err && err.name) || 'Error') + ')';
    }finally{
      if(stream) stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
    }
    r.ms = Math.round(performance.now() - t0);
    return r;
  }
  // 위치(GPS) 켜짐 여부: 위치를 한 번 요청해 받아지면 켜짐. 좌표는 받자마자 버리고 어디에도 남기지 않음
  async function checkGps(){
    const r = {};
    if(!navigator.geolocation){ r.s = 'unknown'; r.why = '위치 기능 없음'; return r; }
    const t0 = performance.now();
    const res = await new Promise(resolve => {
      let done = false;
      const fin = v => { if(!done){ done = true; resolve(v); } };
      try{
        navigator.geolocation.getCurrentPosition(
          () => fin({ok:true}),
          e => fin({ok:false, code:e.code, msg:e.message}),
          {enableHighAccuracy:false, timeout:8000, maximumAge:0});
      }catch(e){ fin({ok:false, code:-1, msg:String(e)}); }
      setTimeout(() => fin({ok:false, code:3, msg:'응답 없음'}), 25000);
    });
    r.ms = Math.round(performance.now() - t0);
    if(res.ok){ r.s = 'on'; r.why = '위치 켜짐'; return r; }
    r.err = 'code ' + res.code + (res.msg ? ': ' + res.msg : '');
    r.perm = await permState('geolocation');
    if(res.code === 2){ r.s = 'off'; r.why = '위치 꺼짐'; }
    else if(res.code === 1){
      if(r.perm === 'denied'){ r.s = 'denied'; r.why = '위치 권한 거부'; }
      else { r.s = 'off'; r.why = '위치 꺼짐(시스템)'; }
    }else{ r.s = 'unknown'; r.why = '위치 응답 없음'; }
    return r;
  }

  // 종합 판정: 카메라가 막혀 있고 GPS가 꺼져 있어야 차단 완료
  function overall(cam, gps){
    if(cam.s === 'open') return 'fail';
    if(cam.s === 'denied') return 'denied';
    if(cam.s !== 'blocked') return 'unknown';
    if(gps && gps.s === 'on') return 'gps';
    if(gps && gps.s === 'denied') return 'denied';
    return 'pass';
  }

  /* ---------- 화면 ---------- */
  function paint(key, opts){
    const v = VERDICTS[key] || VERDICTS.unknown;
    const box = $('#result');
    box.dataset.tone = opts && opts.running ? 'unk' : v.tone;
    $('#icon').innerHTML = ICONS[opts && opts.running ? 'spin' : v.icon];
    $('#title').textContent = opts && opts.running ? '점검 중…' : v.title;
    $('#msg').textContent = opts && opts.running ? '권한 창이 뜨면 ‘허용’, 위치를 켜라는 창이 뜨면 ‘아니요’를 눌러 주세요.' : ((opts && opts.msg) || v.msg);
    $('#why').textContent = (opts && opts.why) || '';
    $('#meta').textContent = (opts && opts.meta) || '';
  }
  function renderItems(cam, mic, gps){
    const box = $('#items');
    if(!cam){ box.hidden = true; box.innerHTML = ''; return; }
    const row = (name, r, note, map) => {
      map = map || ITEM;
      const it = map[r ? r.s : 'unknown'] || map.unknown;
      return '<div class="item" data-tone="' + it.t + '"><span class="k">' + esc(name) + '</span><span class="v">' + MINI[it.i] +
             '<span>' + esc(it.w) + (note ? '<small>' + esc(note) + '</small>' : '') + '</span></span></div>';
    };
    const micNote = IOS && mic && mic.s === 'open' ? '아이폰은 녹음 차단 미지원' : '';
    box.innerHTML = row('카메라', cam) + row('녹음', mic, micNote) + row('위치(GPS)', gps, '', GPS_ITEM);
    box.hidden = false;
  }
  function startClock(atMs){
    if(clockTimer) clearInterval(clockTimer);
    $('#clockbox').hidden = false; $('#hint').hidden = false;
    const box = $('#result');
    const tick = () => {
      const now = new Date();
      $('#clock').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()) + '.' + Math.floor(now.getMilliseconds() / 100);
      const el = Math.max(0, Math.floor((now.getTime() - atMs) / 1000));
      const stale = el > 120;
      $('#elapsed').textContent = '점검 후 ' + pad(Math.floor(el / 60)) + ':' + pad(el % 60) + (stale ? '\n다시 점검 필요' : '');
      box.classList.toggle('stale', stale);
    };
    tick(); clockTimer = setInterval(tick, 100);
  }
  function stopClock(){
    if(clockTimer) clearInterval(clockTimer);
    $('#clockbox').hidden = true; $('#hint').hidden = true;
    $('#result').classList.remove('stale');
  }
  function renderRaw(r){
    const rows = [
      ['판정', r.verdict],
      ['카메라', r.cam.s + ' · ' + r.cam.why + (r.cam.detail ? ' · ' + r.cam.detail : '')],
      ['카메라 오류', r.cam.err || '-'],
      ['카메라 권한/장치', (r.cam.perm || '-') + ' / ' + (r.cam.devices === undefined || r.cam.devices === null ? '-' : r.cam.devices)],
      ['녹음', r.mic ? r.mic.s + ' · ' + r.mic.why : '-'],
      ['녹음 음량', r.mic && r.mic.level ? (r.mic.level.ok ? r.mic.level.peak + ' (' + (r.mic.level.method === 'recorder' ? '녹음 해석' : '실시간') + ')' : r.mic.level.note) + (r.mic.level.bytes !== undefined ? ' · ' + r.mic.level.bytes + 'B' : '') : '-'],
      ['녹음 오류', (r.mic && r.mic.err) || '-'],
      ['위치(GPS)', r.gps ? r.gps.s + ' · ' + r.gps.why : '-'],
      ['위치 오류/권한', ((r.gps && r.gps.err) || '-') + ' / ' + ((r.gps && r.gps.perm) || '-')],
      ['네트워크', netWord(r.net)],
      ['기기', r.device], ['브라우저', r.browser], ['시각', new Date(r.at).toLocaleString('ko-KR')]
    ];
    $('#raw').innerHTML = rows.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('');
  }
  function toast(t){
    const el = $('#toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
  }

  /* ---------- 실행 ---------- */
  async function run(withGesture){
    if(running) return;
    running = true;
    awaitFix = false;
    const btn = $('#again'); btn.disabled = true;
    stopClock();
    $('#appbox').hidden = true;
    renderItems(null);
    paint('unknown', {running:true});
    let ac = null;
    if(withGesture){
      try{ const AC = window.AudioContext || window.webkitAudioContext; if(AC){ ac = new AC(); ac.resume && ac.resume().catch(() => {}); } }catch(e){ ac = null; }
    }
    try{
      if(!window.isSecureContext){
        paint('unknown', {msg:'https 주소로 열어야 점검할 수 있습니다.'}); return;
      }
      if(INAPP){
        paint('unknown', {msg:'카카오톡 등 앱 안 브라우저에서는 점검이 안 됩니다. 메뉴에서 ‘다른 브라우저로 열기’를 눌러 Chrome·삼성 인터넷으로 여세요.'}); return;
      }
      const cam = await checkDevice('video', ac);
      const mic = await checkDevice('audio', ac);
      const gps = await checkGps();
      const net = netType();
      const verdict = overall(cam, gps);
      const at = Date.now();
      last = {verdict, at, cam, mic, gps, net, device:deviceLine(), browser:browserName()};
      const why = verdict === 'unknown' || verdict === 'denied' ? '카메라: ' + cam.why + ' · 위치: ' + gps.why : '';
      const meta = [deviceLine(), browserName(), net ? '네트워크: ' + netWord(net) : ''].filter(x => x && x !== '알 수 없음').join(' · ');
      const msg = verdict === 'pass' && gps.s === 'off' ? '잘하셨습니다! 보안 차단과 GPS 끄기가 모두 확인됐습니다.' : '';
      paint(verdict, {why, meta, msg});
      renderItems(cam, mic, gps);
      awaitFix = verdict === 'fail' || verdict === 'gps';
      startClock(at);
      renderRaw(last);
      renderApp(verdict, mic);
    }catch(e){
      paint('unknown', {why:'오류: ' + ((e && e.message) || e)});
    }finally{
      if(ac){ try{ await ac.close(); }catch(e){} }
      btn.disabled = false;
      running = false;
    }
  }

  $('#again').addEventListener('click', () => run(true));
  // 화면으로 돌아오면 자동 재점검
  // - 차단 안 됨·GPS 켜짐: 보안앱/설정에서 돌아오거나 알림창을 닫는 순간
  // - 그 밖: 10초 넘게 지난 결과면 (앱이 뒤에 열려 있는 채로 NFC 태그를 다시 찍은 경우 포함)
  function recheck(){
    if(running || !last || document.visibilityState !== 'visible') return;
    if(Date.now() - last.at < (awaitFix ? 1500 : 10000)) return;
    setTimeout(() => run(false), 300);
  }
  document.addEventListener('visibilitychange', recheck);
  window.addEventListener('focus', recheck);
  $('#copy').addEventListener('click', async () => {
    if(!last){ toast('아직 점검 결과가 없습니다'); return; }
    const text = JSON.stringify(last, null, 1);
    let ok = false;
    try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); ok = true; } }catch(e){}
    if(!ok){
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try{ ok = document.execCommand('copy'); }catch(e){}
      ta.remove();
    }
    toast(ok ? '결과를 복사했습니다' : '복사 실패 — 화면을 캡처해 주세요');
  });

  /* ---------- 오프라인 저장 ---------- */
  // 신호가 약하거나 없어도 바로 열리도록 페이지를 저장
  if('serviceWorker' in navigator && window.isSecureContext){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  // Chrome의 자동 '앱 설치' 안내를 띄우지 않음 (설치 시 '안전하지 않은 앱 차단됨' 경고가 뜨는 기기가 있음)
  window.addEventListener('beforeinstallprompt', e => e.preventDefault());

  // 페이지가 열리면(NFC 태그·링크) 바로 점검
  run(false);
  window.addEventListener('pageshow', e => { if(e.persisted) run(false); });

  window.__mdmcheck = {classifyError, overall};
})();
</script>
</body>
</html>
